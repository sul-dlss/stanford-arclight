name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["4.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Docker would create the bind-mounted solr-data as root, which the solr user can't write to.
      - name: Create Solr data directory
        run: mkdir -p solr-data && chmod 777 solr-data
      - name: Run tests
        run: bundle exec rake
